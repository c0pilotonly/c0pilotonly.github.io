<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google NoAI</title>
  <link rel="search" type="application/opensearchdescription+xml" title="Google NoAI" href="https://github.io">
  <script>
    const q = new URLSearchParams(window.location.search).get('q');
    if (q) window.location.replace('https://google.com/search?q=' + encodeURIComponent(q) + '+-ai');
  </script>
</head>
<body>
  <form action="/" method="get">
    <input type="text" name="q" value="test">
    <button type="submit">Search</button>
  </form>
</body>
</html>
